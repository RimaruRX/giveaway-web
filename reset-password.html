<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ตั้งรหัสผ่านใหม่ — แจกจริง</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0708; --bg-2:#160f10; --bg-3:#1e1415;
    --gold-1:#fff6d8; --gold-2:#f3cc5c; --gold-3:#c8960f; --gold-4:#7a5a0c; --gold-text:#3a2405;
    --text:#f7ece0; --text-muted:#b79a94; --line:rgba(247,236,224,0.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--text); font-family:'Kanit',sans-serif; padding:20px;
  }
  .box{
    width:100%; max-width:380px; border-radius:18px; padding:30px;
    background:linear-gradient(165deg, var(--bg-3) 0%, var(--bg-2) 75%);
    border:1px solid rgba(247,236,224,0.09);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 18px 32px -18px rgba(0,0,0,0.8);
  }
  h1{ font-size:1.2rem; margin:0 0 18px; }
  .field-label{ font-size:0.82rem; color:var(--text-muted); margin-bottom:6px; display:block; }
  .field-input{
    width:100%; padding:12px 14px; border-radius:10px; margin-bottom:14px;
    background:var(--bg); border:1px solid var(--line); color:var(--text); font-size:0.95rem;
  }
  .submit-btn{
    width:100%; padding:13px; border-radius:10px; border:1px solid rgba(255,244,200,0.7); cursor:pointer;
    font-weight:800; font-size:0.98rem;
    background:linear-gradient(160deg, var(--gold-1) 0%, var(--gold-2) 38%, var(--gold-3) 72%, var(--gold-4) 100%);
    color:var(--gold-text);
  }
  .msg{ font-size:0.85rem; margin-top:12px; text-align:center; min-height:18px; }
  .msg.error{ color:#ff8f8f; }
  .msg.ok{ color:#7be89c; }
</style>
</head>
<body>
  <div class="box">
    <h1>🔑 ตั้งรหัสผ่านใหม่</h1>
    <div id="loading-msg" style="color:var(--text-muted);font-size:0.9rem;">กำลังตรวจสอบลิงก์...</div>

    <form id="reset-form" style="display:none;" onsubmit="return handleReset(event)">
      <label class="field-label">รหัสผ่านใหม่</label>
      <input class="field-input" type="password" id="new-password" required minlength="6" placeholder="อย่างน้อย 6 ตัวอักษร" />
      <button class="submit-btn" type="submit">บันทึกรหัสผ่านใหม่</button>
      <div class="msg" id="reset-msg"></div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // 🔑 ใส่ค่าเดียวกับใน index.html
    const SUPABASE_URL = 'https://vgvstfggkmxgxwicnnxc.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Jj4XOepiICjzOND7HjNs8A_E8N5qzrB';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    sb.auth.onAuthStateChange((event, session) => {
      if(event === 'PASSWORD_RECOVERY'){
        document.getElementById('loading-msg').style.display = 'none';
        document.getElementById('reset-form').style.display = 'block';
      }
    });

    setTimeout(function(){
      if(document.getElementById('reset-form').style.display === 'none'){
        document.getElementById('loading-msg').textContent = 'ลิงก์ไม่ถูกต้องหรือหมดอายุแล้ว กรุณากดลืมรหัสผ่านใหม่อีกครั้งจากหน้าเว็บ';
      }
    }, 3000);

    async function handleReset(e){
      e.preventDefault();
      const password = document.getElementById('new-password').value;
      const msg = document.getElementById('reset-msg');
      msg.className = 'msg';
      msg.textContent = 'กำลังบันทึก...';

      const { error } = await sb.auth.updateUser({ password });
      if(error){
        msg.className = 'msg error';
        msg.textContent = error.message;
        return false;
      }
      msg.className = 'msg ok';
      msg.textContent = 'เปลี่ยนรหัสผ่านสำเร็จ! กำลังพากลับหน้าแรก...';
      setTimeout(function(){ window.location.href = '/'; }, 1500);
      return false;
    }
  </script>
</body>
</html>
